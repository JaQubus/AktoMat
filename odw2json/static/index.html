<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AktoMat</title>
<meta name="description" content="Teczka sprawy odwoławczej: wczytywanie, klasyfikacja i ekstrakcja danych z odwołań, pełnomocnictw i potwierdzeń przelewu, weryfikacja pól i kontrola formalna.">
<style>
  :root {
    --bg: #eff3f2; --panel: #ffffff; --panel-2: #f5f8f7; --ink: #142221; --muted: #4a5b59; --line: #d3dddb; --line-strong: #afbfbc;
    --brand: #0d4547; --brand-ink: #ffffff;
    --accent: #0c6b67; --accent-ink: #ffffff; --accent-soft: #dff0ed; --focus: #f0a500;
    --ok: #1f7a3a; --ok-soft: #e2f2e6; --warn: #8a5300; --warn-soft: #fcf0d6; --bad: #a3261b; --bad-soft: #fbe5e1;
    --llm: #4b3aa8; --llm-soft: #ebe8fa; --rules: #1f7a3a; --rules-soft: #e2f2e6; --derived: #8a5300; --derived-soft: #faf0d9; --manual: #0b5f86; --manual-soft: #e0f0f7;
    --k-odw: #0c6b67; --k-odw-soft: #dff0ed; --k-pel: #4b3aa8; --k-pel-soft: #ebe8fa; --k-prz: #9a4a10; --k-prz-soft: #fbeadb;
    --mark: rgba(255, 190, 0, .40); --mark-line: #b98200; --viewer: #4f5f5e;
    --radius: 8px; --shadow: 0 1px 2px rgba(13, 40, 40, .08), 0 2px 8px rgba(13, 40, 40, .05);
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1514; --panel: #142020; --panel-2: #192827; --ink: #e4eeec; --muted: #a2b6b2; --line: #283a38; --line-strong: #3a504d;
      --brand: #092d2e; --accent: #4cc2b5; --accent-ink: #052120; --accent-soft: #123432;
      --ok: #74d396; --ok-soft: #153223; --warn: #f2c14e; --warn-soft: #33290f; --bad: #ff9a88; --bad-soft: #3b1c18;
      --llm: #aea6ff; --llm-soft: #252046; --rules: #74d396; --rules-soft: #153223; --derived: #f2c14e; --derived-soft: #33290f; --manual: #7fd0f2; --manual-soft: #11303c;
      --k-odw: #4cc2b5; --k-odw-soft: #123432; --k-pel: #aea6ff; --k-pel-soft: #252046; --k-prz: #f0a668; --k-prz-soft: #3a2614;
      --viewer: #22302f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1514; --panel: #142020; --panel-2: #192827; --ink: #e4eeec; --muted: #a2b6b2; --line: #283a38; --line-strong: #3a504d;
    --brand: #092d2e; --accent: #4cc2b5; --accent-ink: #052120; --accent-soft: #123432;
    --ok: #74d396; --ok-soft: #153223; --warn: #f2c14e; --warn-soft: #33290f; --bad: #ff9a88; --bad-soft: #3b1c18;
    --llm: #aea6ff; --llm-soft: #252046; --rules: #74d396; --rules-soft: #153223; --derived: #f2c14e; --derived-soft: #33290f; --manual: #7fd0f2; --manual-soft: #11303c;
    --k-odw: #4cc2b5; --k-odw-soft: #123432; --k-pel: #aea6ff; --k-pel-soft: #252046; --k-prz: #f0a668; --k-prz-soft: #3a2614;
    --viewer: #22302f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 8px; top: -60px; background: var(--panel); color: var(--ink); padding: 8px 12px; border-radius: 6px; z-index: 10; }
  .skip:focus { top: 8px; }
  a { color: var(--accent); }

  /* ---------- pasek górny ---------- */
  .topbar { background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 18px; padding: 0 20px; min-height: 60px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 0; background: none; border: 0; color: inherit; cursor: pointer; }
  .brand b { font-size: 18px; letter-spacing: .2px; }
  .search { flex: 1 1 300px; max-width: 560px; position: relative; }
  .search input { width: 100%; height: 38px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; padding: 0 12px 0 34px; font-size: 14px; }
  .search input::placeholder { color: rgba(255,255,255,.7); }
  .search svg { position: absolute; left: 10px; top: 11px; opacity: .8; }
  .topbar .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa3b2; flex: none; }
  .dot.on { background: #6fe0a0; } .dot.off { background: #f0a500; }
  .who { background: none; border: 1px solid transparent; color: #fff; font-size: 14px; padding: 4px 8px; border-radius: 6px; cursor: pointer; opacity: .92; }
  .who:hover { border-color: rgba(255,255,255,.3); }
  .iconbtn { background: none; border: 1px solid rgba(255,255,255,.3); color: var(--brand-ink); border-radius: 6px; padding: 5px 8px; cursor: pointer; }

  /* ---------- układ ---------- */
  .shell { flex: 1; min-height: 0; display: flex; }
  nav.side { flex: none; width: 250px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .navlist { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: auto; flex: 1; }
  .nav { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--ink); }
  .nav:hover { background: var(--panel-2); }
  .nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav .n { margin-left: auto; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 0 8px; }
  .nav .n.hot { background: var(--focus); color: #142221; }
  .nav .n.bad { color: var(--bad); }
  .nav.sub { padding-left: 26px; font-size: 13.5px; }
  .nav.sub .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navsep { height: 1px; background: var(--line); margin: 8px 4px; }
  .navlabel { font-size: 13px; color: var(--muted); padding: 12px 12px 4px; font-weight: 600; }
  .nav.cfg { font-size: 13.5px; color: var(--muted); padding-top: 7px; padding-bottom: 7px; }
  .nav.cfg[aria-current="page"] { color: var(--accent); }
  .navfoot { padding: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  main#main { flex: 1; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .page { padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1400px; width: 100%; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); padding: 0 14px; min-height: 40px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--bad); font-weight: 600; }
  .btn.quiet:hover:not(:disabled) { background: var(--bad-soft); }
  .src-note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .src-note code { font-family: var(--mono); font-size: 12px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; counter-reset: st; }
  .steps li { counter-increment: st; position: relative; padding: 0 24px 0 46px; }
  .steps li + li { border-left: 1px solid var(--line); padding-left: 70px; }
  .steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; }
  .steps li + li::before { left: 24px; }
  .steps b { display: block; font-size: 15px; margin-bottom: 2px; }
  .steps span { color: var(--muted); font-size: 14px; }
  @media (max-width: 900px) { .steps { grid-template-columns: 1fr; gap: 16px; } .steps li + li { border-left: 0; padding-left: 46px; } .steps li + li::before { left: 0; } }
  .cmp small { display: block; color: var(--muted); font-size: 12.5px; }
  .crumb { font-size: 13px; color: var(--muted); }
  .crumb button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
  h1 { margin: 2px 0 6px; font-size: 25px; line-height: 1.25; }
  h2 { margin: 0; font-size: 16px; }
  .meta { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 600; }
  .headrow { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .headrow > div:first-child { flex: 1 1 420px; min-width: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .card-h h2 { flex: 1; }
  .card-b { padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { padding: 14px 16px; }
  .stat .l { font-size: 13px; color: var(--muted); }
  .stat .v { font-size: 26px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .stat .s { font-size: 13px; color: var(--muted); }
  .v.warn { color: var(--warn); } .v.bad { color: var(--bad); } .v.ok { color: var(--ok); }
  .cols { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .cols > .wide { flex: 3 1 520px; min-width: 0; }
  .cols > .narrow { flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .tw { overflow-x: auto; position: relative; }
  td.nw { white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; padding: 10px 12px; background: var(--panel-2); }
  td { padding: 11px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  th:first-child, td:first-child { padding-left: 16px; } th:last-child, td:last-child { padding-right: 16px; }
  td.mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
  .tag { display: inline-block; border-radius: 4px; padding: 1px 8px; font-weight: 600; font-size: 13px; white-space: nowrap; border: 1px solid transparent; }
  .t-odwolanie { background: var(--k-odw-soft); color: var(--k-odw); }
  .t-pelnomocnictwo { background: var(--k-pel-soft); color: var(--k-pel); }
  .t-przelew { background: var(--k-prz-soft); color: var(--k-prz); }
  .t-other { background: var(--panel-2); color: var(--muted); border-color: var(--line-strong); }
  .t-rej { color: var(--muted); border-color: var(--line-strong); font-weight: 500; }
  .st-ok { color: var(--ok); font-weight: 600; } .st-warn { color: var(--warn); font-weight: 600; } .st-bad { color: var(--bad); font-weight: 600; } .st-muted { color: var(--muted); }
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
  .checks .ico { font-weight: 800; text-align: center; }
  .checks .skipbtn { margin-left: 8px; vertical-align: 1px; }
  .checks li.skipped > span:last-child > span:first-of-type, .skipped-row td:first-child { color: var(--muted); }

  /* ---------- sesje, referent ---------- */
  .sess { background: none; border: 1px solid rgba(255,255,255,.22); color: #fff; font: inherit; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; cursor: pointer; max-width: 280px; display: inline-flex; gap: 6px; align-items: center; }
  .sess:hover { background: rgba(255,255,255,.1); }
  .sess .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .st { opacity: .75; white-space: nowrap; }
  dialog.dlg { border: 1px solid var(--line-strong); border-radius: 12px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); box-shadow: 0 20px 48px rgba(0,0,0,.3); }
  dialog.dlg::backdrop { background: rgba(8, 24, 24, .45); }
  .dlg form { padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
  .dlg h2 { margin: 0; font-size: 19px; }
  .dlg p { margin: 0; color: var(--muted); font-size: 14px; }
  .dlg input { height: 44px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 12px; font: inherit; font-size: 15px; background: var(--panel); color: var(--ink); }
  .dlg .recent { display: flex; flex-wrap: wrap; gap: 6px; }
  .dlg .recent button { border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .dlg .recent button:hover { border-color: var(--accent); color: var(--accent); }
  .dlg .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .sesslist td .acts { display: flex; gap: 6px; justify-content: flex-end; }
  .sesslist tr.cur td:first-child b::after { content: "bieżąca"; margin-left: 8px; font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }

  /* ---------- rejestr spraw, kalkulator terminów ---------- */
  .regbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .regbar input[type=search] { flex: 1 1 320px; height: 42px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 12px; font: inherit; background: var(--panel); color: var(--ink); }
  .regbar label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
  .regbar input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  table.reg td { vertical-align: top; }
  table.reg td small { display: block; color: var(--muted); font-size: 12.5px; }
  table.reg tr.click:hover td { background: var(--panel-2); }
  .rel { display: inline-flex; align-items: center; gap: 4px; background: var(--llm-soft); color: var(--llm); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; margin: 2px 4px 2px 0; white-space: nowrap; }
  .due { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; margin-top: 3px; white-space: nowrap; }
  .due.past { background: var(--bad-soft); color: var(--bad); } .due.soon { background: var(--warn-soft); color: var(--warn); } .due.ok { background: var(--ok-soft); color: var(--ok); }
  mark.hit { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .tc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .tc-res { font-size: 15px; line-height: 1.5; }
  .tc-res .big { font-size: 30px; font-weight: 700; letter-spacing: -.3px; color: var(--ink); }
  .mcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .mcal .h { text-align: center; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 0; }
  .mcal .d { text-align: center; padding: 6px 0; border-radius: 6px; color: var(--ink); }
  .mcal .d.out { visibility: hidden; }
  .mcal .d.we, .mcal .d.hol { color: var(--bad); }
  .mcal .d.in { background: var(--accent-soft); }
  .mcal .d.start { box-shadow: inset 0 0 0 2px var(--accent); }
  .mcal .d.end { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .mcal .d.skip { background: var(--warn-soft); color: var(--warn); }
  .mcal-t { font-weight: 700; text-transform: capitalize; margin: 4px 0 6px; }

  /* ---------- okna i powiadomienia ---------- */
  .dlg .lbl { font-size: 13px; color: var(--muted); margin-bottom: -6px; }
  .dlg textarea { min-height: 84px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 6px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--panel); color: var(--ink); }
  .dlg .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  :root[data-theme="dark"] .dlg .btn.danger { color: #2a0d09; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dlg .btn.danger { color: #2a0d09; } }
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 1100; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; min-width: 240px; max-width: 420px; background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 10px 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: 14px; animation: tIn .18s ease-out; }
  .toast.bad { border-left-color: var(--bad); } .toast.warn { border-left-color: var(--warn); } .toast.ok { border-left-color: var(--ok); }
  .toast .tx { flex: 1; padding-top: 2px; }
  .toast button { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
  .toast button:hover { background: var(--panel-2); color: var(--ink); }
  .toast.out { opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
  @keyframes tIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } .toast.out { transition: none; } }

  /* ---------- kalendarz ---------- */
  .dp-wrap { position: relative; display: block; }
  .dp-wrap > input { padding-right: 44px !important; width: 100%; box-sizing: border-box; }
  .dp-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--accent); cursor: pointer; display: grid; place-items: center; }
  .dp-btn:hover { background: var(--accent-soft); }
  .dp-btn svg { width: 18px; height: 18px; }
  .dp { position: fixed; z-index: 1000; width: 304px; background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .22), 0 2px 6px rgba(0, 0, 0, .12); padding: 12px; font-size: 14px; animation: dpIn .12s ease-out; }
  @keyframes dpIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .dp { animation: none; } }
  .dp-h { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .dp-h .t { flex: 1; text-align: center; font-weight: 700; text-transform: capitalize; }
  .dp-h button, .dp-f button { height: 32px; min-width: 32px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
  .dp-h button:hover, .dp-f button:hover { background: var(--panel-2); border-color: var(--line); }
  .dp-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dp-g .wd { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 4px 0; }
  .dp-g .wd.we { color: var(--bad); opacity: .8; }
  .dp-d { position: relative; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; }
  .dp-d:hover { background: var(--accent-soft); }
  .dp-d.out { color: var(--muted); opacity: .55; }
  .dp-d.we { color: var(--bad); }
  .dp-d.hol { color: var(--bad); font-weight: 700; }

<script>
const $ = (s, r = document) => r.querySelector(s);

/* Komunikat: czytnik ekranu + powiadomienie w rogu ekranu (zamiast alert). */
function say(t, kind) {
  $("#live").textContent = t;
  if (!t) return;
  kind = kind || (/^(Nie udało|Błąd)/.test(t) ? "bad" : /^Pominięto pliki|Pominięto \d/.test(t) ? "warn" : "");
  const box = $("#toasts"); if (!box) return;
  while (box.children.length >= 4) box.firstElementChild.remove();

  el.firstElementChild.textContent = t; box.appendChild(el);
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 220); };
  el.lastElementChild.onclick = close;
  let timer = setTimeout(close, kind === "bad" ? 8000 : 4000);

function ask({ title, text = "", input = null, ok = "OK", cancel = "Anuluj", danger = false }) {
  return new Promise((resolve) => {

/* ---------- stan dokumentów ---------- */
const stateOf = (it) => it.pending ? "pending" : it.blad ? "err" : it.klasa ? "ok" : "rej";
const caseNames = () => [...new Set(S.items.map(i => i.sprawa))];
const caseItems = (name) => S.items.filter(i => i.sprawa === name);
function valOf(it, p) { const f = it.slad?.pola?.[p]; return p in (it.edits || {}) ? it.edits[p] : f?.wartosc; }
function validation(it, p) { return S.checks[it.sprawa]?.walidacja?.[it.plik]?.[p]; }
function needsCheck(it, p) {
  if (it.ok?.[p]) return false;
  const f = it.slad?.pola?.[p]; if (!f) return false;
  const v = valOf(it, p);
  return v === null || v === undefined || (f.zrodlo === "LLM" && !(p in it.edits)) || (f.uwagi || []).length > 0 || validation(it, p)?.ok === false;
}
function counts(it) {
  const pola = Object.keys(it.slad?.pola || {});
  const todo = pola.filter(p => needsCheck(it, p)).length, done = pola.filter(p => it.ok?.[p]).length;
  return { total: pola.length, todo, done };
}
function matches(it) {
  if (!S.q.trim()) return true;
  const q = compact(S.q);
  return compact(it.plik + " " + it.sprawa + " " + JSON.stringify(it.json || {})).includes(q);
}

/* ---------- sesje: zapis pracy na serwerze (katalog sesje/, poza gitem) ---------- */
let saveTimer = null, restoring = false;
const newSid = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");
function sessState(t) { $("#sess").hidden = !S.sid; $("#sessName").textContent = S.sname || "Sesja"; $("#sessState").textContent = t || ""; }
function sessionPayload() {
  const items = S.items.filter(i => !i.pending).map(i => ({ id: i.id, plik: i.plik, sprawa: i.sprawa, sciezka: i.sciezka, klasa: i.klasa, json: i.json, orig: i.orig, slad: i.slad, edits: i.edits, ok: i.ok, blad: i.blad }));
  const letters = Object.fromEntries(Object.entries(S.letters).map(([k, v]) => [k, { id: v.id, syg: v.syg, data: v.data, edited: v.edited, tekst: v.edited ? v.tekst : "" }]));
  return { items, skip: S.skip, letters, log: S.log, termDays: S.termDays };
}
function markDirty() {
  if (restoring || !S.items.some(i => !i.pending)) return;
  if (!S.sid) { S.sid = newSid(); S.sname = `${caseNames()[0] || "Sprawy"} · ${new Date().toLocaleDateString("pl-PL")}`; try { localStorage.setItem("aktomat-sid", S.sid); } catch (e) {} }
  sessState("zapisywanie…");
  clearTimeout(saveTimer); saveTimer = setTimeout(saveSession, 1200);
}
async function saveSession() {
  if (!S.sid) return;
  try {
    const r = await fetch(`/api/sesje/${S.sid}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nazwa: S.sname, referent: S.who, stan: sessionPayload() }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const res = await r.json();
    sessState("zapisano " + new Date(res.zmieniono).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" }));
    if (S.view !== "rejestr" && S.view !== "terminy") regState.rows = null;
  } catch (e) { sessState("błąd zapisu"); }
}
async function loadSessions() { try { S.sessions = await (await fetch("/api/sesje")).json(); } catch (e) { S.sessions = []; } return S.sessions; }
async function openSession(sid, quiet) {
  let d; try { const r = await fetch(`/api/sesje/${sid}`); if (!r.ok) throw 0; d = await r.json(); } catch (e) { if (!quiet) say("Nie udało się otworzyć sesji."); return false; }
  clearTimeout(saveTimer); restoring = true;
  const st = d.stan || {};
  Object.assign(S, { sid, sname: d.nazwa || sid, items: (st.items || []).map(i => ({ ...i, pending: false, edits: i.edits || {}, ok: i.ok || {} })),
    skip: st.skip || {}, letters: st.letters || {}, log: st.log || [], termDays: st.termDays || {}, checks: {}, checksRaw: {}, current: null, caseName: null });
  try { localStorage.setItem("aktomat-sid", sid); } catch (e) {}
  caseNames().forEach(n => recheck(n));
  restoring = false;
  sessState("zapisano " + (d.zmieniono ? new Date(d.zmieniono).toLocaleString("pl-PL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : ""));
  say(`Otwarto sesję „${S.sname}”.`);
  go("start");
  return true;
}
function newSession() {
  clearTimeout(saveTimer); if (S.sid && S.items.length) saveSession();
  Object.assign(S, { sid: null, sname: "", items: [], skip: {}, letters: {}, log: [], termDays: {}, checks: {}, checksRaw: {}, current: null, caseName: null });
  try { localStorage.removeItem("aktomat-sid"); } catch (e) {}
  sessState(); loadSessions().then(() => go("start"));
}
$("#sess").onclick = async () => {
  const v = await ask({ title: "Nazwa sesji", text: "Nazwa pojawia się na liście zapisanych sesji.", input: { label: "Nazwa", value: S.sname, rows: 1 }, ok: "Zapisz" });

};

  return `<section class="card"><div class="card-h"><h2>Zapisane sesje</h2><span class="st-muted" style="font-size:13px">Praca zapisuje się sama, można wrócić do niej później.</span></div>
    <div class="tw"><table class="sesslist"><thead><tr><th>Sesja</th><th>Sprawy</th><th>Dokumenty</th><th>Referent</th><th>Zmieniono</th><th></th></tr></thead><tbody>

      <td><div class="acts">${x.id === S.sid ? "" : `<button class="btn sm primary" type="button" data-open="${esc(x.id)}">Otwórz</button>`}<button class="btn sm quiet" type="button" data-del="${esc(x.id)}" aria-label="Usuń sesję ${esc(x.nazwa)}">Usuń</button></div></td></tr>`).join("")}
    </tbody></table></div></section>`;
}
function bindSessions() {
  $$("[data-open]").forEach(b => b.onclick = () => openSession(b.dataset.open));
  $$("[data-del]").forEach(b => b.onclick = async () => {
    const x = S.sessions.find(s => s.id === b.dataset.del);
    if (!await ask({ title: "Usunąć sesję?", text: `Sesja „${x?.nazwa}” zostanie usunięta razem z wczytanymi plikami PDF, poprawkami i dziennikiem. Tego nie da się cofnąć.`, ok: "Usuń sesję", danger: true })) return;
    await fetch(`/api/sesje/${b.dataset.del}`, { method: "DELETE" });
    if (b.dataset.del === S.sid) return newSession();
    await loadSessions(); render();
  });
  $("#newSess") && ($("#newSess").onclick = newSession);
  $("#regCsv") && ($("#regCsv").onclick = () => { save(new Blob(["﻿" + registerCsv(caseNames())], { type: "text/csv;charset=utf-8" }), "rejestr_spraw.csv"); say("Pobrano rejestr spraw."); });
}

/* ---------- usuwanie sprawy z sesji (także po kontroli) ---------- */
async function deleteCase(name) {
  const its = caseItems(name);
  if (!its.length) return;
  if (its.some(i => i.pending)) return say("Poczekaj, aż analiza dokumentów tej sprawy się skończy.", "warn");
  const ok = await ask({ title: `Usunąć sprawę „${name}”?`, text: `Z sesji znikną ${its.length} ${plural(its.length, "dokument", "dokumenty", "dokumentów")} razem z poprawkami, zatwierdzeniami, pominięciami i projektem pisma. Wpisy w dzienniku zmian zostają. Tego nie da się cofnąć.`, ok: "Usuń sprawę", danger: true });
  if (!ok) return;
  S.items = S.items.filter(i => i.sprawa !== name);
  delete S.skip[name]; delete S.letters[name]; delete S.checks[name]; delete S.checksRaw[name];
  S.log.push({ czas: new Date().toISOString(), kto: S.who || "", sprawa: name, plik: "(sprawa)", pole: "", akcja: `usunięto sprawę (${its.length} dok.)`, z: null, na: null });
  its.forEach(i => { if (i.id) fetch(`/api/pliki/${i.id}`, { method: "DELETE" }).catch(() => {}); });
  regState.rows = null;
  say(`Usunięto sprawę „${name}”.`);
  if (S.caseName === name) S.caseName = null;
  if (S.current && S.current.sprawa === name) S.current = null;
  if (!S.items.length && S.sid) { clearTimeout(saveTimer); await saveSession(); }
  else markDirty();
  drawNav(); go("start");
}

/* ---------- rejestr spraw (kolumny z config/eksport.yaml) ---------- */
function getPath(obj, path) {
  let o = obj;
  for (const k of String(path).match(/[^.[\]]+/g) || []) { if (o == null) return null; o = o[/^\d+$/.test(k) ? +k : k]; }
  return o ?? null;
}
function registerRow(n) {
  const its = caseItems(n), ch = S.checks[n], all = ch ? [...ch.wymagane, ...ch.pola, ...ch.zgodnosc] : [];
  const misses = all.filter(x => ["brak", "niezgodne"].includes(x.wynik)), skipped = all.filter(x => x.wynik === "pominiete");
  const todo = its.reduce((a, i) => a + counts(i).todo, 0), term = ch?.terminy?.[0];
  const v = { sprawa: n, referent: S.who, dokumenty: its.length, do_sprawdzenia: todo, braki: misses.map(x => x.opis).join("; "), pominiete: skipped.map(x => x.opis).join("; "),
    termin: term?.do ? fmtDate(term.do) : "", stan: !ch ? "" : misses.length ? "braki formalne" : todo ? "w weryfikacji" : "gotowa" };
  return (S.eksport?.rejestr?.kolumny || []).map(c => c.wartosc ? v[c.wartosc] ?? "" : getPath(its.find(i => i.klasa === c.klasa)?.json, c.pole));
}
function registerCsv(names) { return csv([(S.eksport?.rejestr?.kolumny || []).map(c => c.naglowek), ...names.map(registerRow)]); }

const queue = []; let running = 0, total = 0, done = 0, firstCase = null;

// Zerwane połączenie (np. restart serwera): do 3 prób z odstępem 2 s i 5 s, zanim dokument dostanie błąd.

    const fd = new FormData(); fd.append("files", x.file, x.file.name); fd.append("sciezki", x.rel);
    try {

      return await r.json();

}

/* ---------- kalkulator terminów (rodzaje terminów i święta z config/kontrola.yaml) ---------- */
const termState = { start: "", rule: 0, days: null };
function calcDeadline(start, days) {
  const end = new Date(start); end.setDate(end.getDate() + days);
  const skipped = [];
  while ((end.getDay() + 6) % 7 > 4 || holidays(end.getFullYear()).has(isoOf(end))) { skipped.push(isoOf(end)); end.setDate(end.getDate() + 1); }
  return { end, skipped };
}
function miniCal(y, mo, start, end, skipped) {
  const first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, n = new Date(y, mo + 1, 0).getDate(), hol = holidays(y);
  let h = `<div class="mcal-t">${MIES[mo]} ${y}</div><div class="mcal">${DNI_K.map(d => `<span class="h">${d}</span>`).join("")}`;
  for (let i = 0; i < lead; i++) h += `<span class="d out"></span>`;
  for (let d = 1; d <= n; d++) {
    const dt = new Date(y, mo, d), iso = isoOf(dt), we = (dt.getDay() + 6) % 7 > 4;
    const cls = ["d", we && "we", hol.has(iso) && "hol", dt > start && dt < end && "in", sameDay(dt, start) && "start", sameDay(dt, end) && "end", skipped.includes(iso) && "skip"].filter(Boolean).join(" ");
    h += `<span class="${cls}" title="${d} ${MIES_D[mo]}${hol.has(iso) ? ", święto" : we ? ", dzień wolny" : ""}">${d}</span>`;
  }
  return h + "</div>";
}
function renderTerms() {
  const terms = S.rules?.terminy || [];

  const rule = terms[termState.rule], variants = rule ? (rule.warianty || [rule.dni]) : [];
  if (termState.days == null) termState.days = rule ? +rule.dni : 10;
  const start = parseAnyDate(termState.start), days = Math.max(0, +termState.days || 0);
  const res = start ? calcDeadline(start, days) : null;
  const upcoming = (regState.rows || []).filter(r => r.termin && daysTo(r.termin) >= 0).sort((a, b) => a.termin.localeCompare(b.termin)).slice(0, 8);
  $("#main").innerHTML = `<div class="page">
    <div class="headrow"><div><h1>Kalkulator terminów</h1><p class="lead">Wybierz rodzaj terminu i datę zdarzenia. Jeśli ostatni dzień wypada w sobotę, niedzielę albo święto, termin przesuwa się na najbliższy dzień roboczy. Wynik to podpowiedź dla referenta.</p><p class="src-note">Rodzaje terminów i święta: <code>config/kontrola.yaml</code></p></div></div>
    <div class="cols">
      <div class="wide" style="display:flex;flex-direction:column;gap:16px">
        <section class="card card-b"><div class="tc-grid">
          <div class="letter-side" style="gap:10px">
            ${terms.length ? `<label for="tcRule">Rodzaj terminu</label><select id="tcRule">${terms.map((t, i) => `<option value="${i}" ${i === termState.rule ? "selected" : ""}>${esc(t.opis || t.id)}</option>`).join("")}<option value="-1" ${termState.rule === -1 ? "selected" : ""}>Inny termin</option></select>` : ""}
            <label for="tcStart">Data zdarzenia (np. czynności, doręczenia)</label><input id="tcStart" value="${esc(termState.start)}">
            <label for="tcDays">Liczba dni</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap">${variants.map(v => `<button type="button" class="btn sm ${+v === days ? "primary" : ""}" data-days="${v}">${v} dni</button>`).join("")}<input id="tcDays" type="number" min="0" max="365" value="${days}" style="width:110px" aria-label="Własna liczba dni"></div>
          </div>
          <div class="tc-res">${res ? `<div class="st-muted" style="font-size:13px">${esc(rule?.opis || "Ostatni dzień terminu")}</div>
            <div class="big">${plOf(res.end)}</div><div>${DNI[(res.end.getDay() + 6) % 7]} · ${dueBadge(isoOf(res.end))}</div>
            <p style="margin:10px 0 0;font-size:14px;color:var(--muted)">${days} ${plural(days, "dzień", "dni", "dni")} od ${plOf(start)}.${res.skipped.length ? ` Koniec terminu wypadał ${res.skipped.length > 1 ? "w dni wolne" : "w dzień wolny"} (${res.skipped.map(x => fmtDate(x)).join(", ")}), więc przesunięto go na najbliższy dzień roboczy.` : ""}</p>` : '<p class="st-muted">Podaj datę zdarzenia.</p>'}</div>
        </div></section>

          <p class="st-muted" style="font-size:13px;margin:10px 0 0">W ramce dzień zdarzenia, na jasnym tle bieg terminu, na ciemnym ostatni dzień. Na żółto dni wolne, z których przesunięto termin. Czerwone cyfry to weekendy i święta.</p></section>` : ""}
      </div>
      <div class="narrow">
        <section class="card card-b"><h2 style="margin-bottom:10px">Najbliższe terminy w sprawach</h2>
          ${regState.rows == null ? '<span class="spinner"></span>' : upcoming.length ? `<ul class="checks">${upcoming.map(r => `<li><span class="ico st-muted" aria-hidden="true">•</span><span><a href="#" data-rs="${esc(r.sesja)}" data-rc="${esc(r.sprawa)}">${esc(r.odwolujacy || r.sprawa)}</a><small>${fmtDate(r.termin)} · ${dueBadge(r.termin)}${r.numer_postepowania ? " · " + esc(r.numer_postepowania) : ""}</small></span></li>`).join("")}</ul>` : '<p class="st-muted" style="margin:0;font-size:14px">Brak nadchodzących terminów w zapisanych sprawach.</p>'}
        </section>
      </div>
    </div></div>`;
  if (regState.rows == null && !regState.loading) loadRegistry().then(() => S.view === "terminy" && renderTerms());
  $("#tcRule") && ($("#tcRule").onchange = (e) => { termState.rule = +e.target.value; const r = terms[termState.rule]; if (r) termState.days = +r.dni; renderTerms(); });
  attachDate($("#tcStart"), "pl");
  $("#tcStart").onchange = (e) => { if (termState.start === e.target.value) return; termState.start = e.target.value; setTimeout(renderTerms); };
  $("#tcDays").onchange = (e) => { if (termState.days === +e.target.value) return; termState.days = +e.target.value; setTimeout(renderTerms); };
  $$("[data-days]").forEach(b => b.onclick = () => { termState.days = +b.dataset.days; renderTerms(); });
  $$("a[data-rs]").forEach(a => a.onclick = (e) => { e.preventDefault(); openCase(a.dataset.rs, a.dataset.rc); });
}

const csvCell = (v) => { const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

      <details><summary>Pola i źródła wartości</summary><div class="tw"><table><thead><tr><th>Ścieżka</th><th>Typ</th><th>Źródło</th></tr></thead><tbody>${c.pola.map(p => `<tr><td class="mono">${esc(p.sciezka)}</td><td>${esc(p.typ)}</td><td>${esc(p.zrodlo)}</td></tr>`).join("")}</tbody></table></div></details>
      <details><summary>Szablon JSON</summary><pre style="margin:8px 0 0">${esc(JSON.stringify(c.szablon, null, 2))}</pre></details></article>`).join("")}</div>
    <section class="card"><div class="card-h"><h2>Reguły kontroli formalnej (kontrola.yaml)</h2></div><div class="tw"><table><thead><tr><th>Rodzaj</th><th>Sprawdzenie</th><th>Szczegóły</th></tr></thead><tbody>
      ${(r.wymagane || []).map(x => `<tr><td>wymagany dokument</td><td>${esc(x.opis)}</td><td class="mono">${esc(x.klasa)}${x.wzorzec ? ` · ${esc(x.pole)} ~ /${esc(x.wzorzec)}/` : ""}</td></tr>`).join("")}
      ${(r.zgodnosc || []).map(x => `<tr><td>zgodność</td><td>${esc(x.opis)}</td><td class="mono">${esc(x.a.klasa)}:${esc(x.a.pole)} ↔ ${esc(x.b.klasa)}:${esc(x.b.pole)} (${esc(x.tryb)})</td></tr>`).join("")}
      ${(r.terminy || []).map(x => `<tr><td>termin</td><td>${esc(x.opis)}</td><td class="mono">${esc(x.klasa)}:${esc(x.pole)} + ${esc(x.dni)} dni</td></tr>`).join("")}
      ${Object.entries(r.walidacja || {}).map(([k, v]) => `<tr><td>walidacja</td><td>Suma kontrolna: ${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join("")}
    </tbody></table></div></section></div>`;
}

/* ---------- raport ---------- */
function renderReport() {
  $("#main").innerHTML = `<div class="page md" id="report"><div class="empty"><span class="spinner"></span></div></div>`;
  fetch("/api/raport").then(r => r.json()).then(r => {
    $("#report").innerHTML = r.jest ? md(r.tekst) : `<h1>Raport jakości</h1><p class="lead">Raport jeszcze nie powstał. Uruchom ocenę na danych treningowych:</p><pre style="margin:12px 0">python -m odw2json eval --gt &lt;hacknation-2026&gt;/dane --no-llm</pre>`;
  });
}
function md(src) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const lines = src.split(/\r?\n/); let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^[\s|:-]+$/.test(r)));
      out += `<div class="tw card"><table><thead><tr>${cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (/^\s*[-*]\s+/.test(l)) { out += "<ul>"; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) out += `<li>${inline(lines[i++].replace(/^\s*[-*]\s+/, ""))}</li>`; out += "</ul>"; continue; }
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
    i++;
  }
  return out;
}

/* ---------- pobieranie ---------- */
const outName = (it) => it.plik.replace(/\.pdf$/i, "") + ".json";
const outBody = (it) => it.klasa ? JSON.stringify(it.json, null, 2) : (S.status?.pusty_json ?? "{}");
function save(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function downloadZip(items, name, inne = [], opts = {}) {
  const pliki = items.filter(it => !it.pending && !it.blad).map(it => ({ sciezka: (it.sprawa && it.sprawa !== "bez sprawy" ? it.sprawa + "/" : "") + outName(it), json: it.klasa ? it.json : (S.status?.pusty_json ?? "{}") }));
  try {
    const r = await fetch("/api/zip", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pliki, inne, ukryj: !!opts.ukryj }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    save(await r.blob(), name); say(`Pobrano ${pliki.length} plików JSON w archiwum ZIP${opts.ukryj ? " (bez danych osobowych)" : ""}.`);
  } catch (e) { say("Nie udało się przygotować archiwum: " + e.message); }
}
$("#zipAll").onclick = () => downloadZip(S.items, "wyniki_aktomat.zip", [{ sciezka: "rejestr_spraw.csv", tekst: registerCsv(caseNames()) }, ...(S.log.length ? [{ sciezka: "dziennik_zmian.csv", tekst: logCsv(S.log) }] : [])]);

drawNav(); render();
fetch("/api/eksport").then(r => r.json()).then(c => { S.eksport = c; }).catch(() => {});
loadSessions().then(async (list) => {
  let last = null; try { last = localStorage.getItem("aktomat-sid"); } catch (e) {}
  if (last && list.some(x => x.id === last) && !S.items.length) await openSession(last, true);
  else if (S.view === "start") render();
  if (!S.who) openWho();
});
