<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AktoMat</title>
<meta name="description" content="Teczka sprawy odwoławczej: wczytywanie, klasyfikacja i ekstrakcja danych z odwołań, pełnomocnictw i potwierdzeń przelewu, weryfikacja pól i kontrola formalna.">
<style>
  :root {
    --bg: #eff3f2; --panel: #ffffff; --panel-2: #f5f8f7; --ink: #142221; --muted: #4a5b59; --line: #d3dddb; --line-strong: #afbfbc;
    --brand: #0d4547; --brand-ink: #ffffff;
    --accent: #0c6b67; --accent-ink: #ffffff; --accent-soft: #dff0ed; --focus: #f0a500;
    --ok: #1f7a3a; --ok-soft: #e2f2e6; --warn: #8a5300; --warn-soft: #fcf0d6; --bad: #a3261b; --bad-soft: #fbe5e1;
    --llm: #4b3aa8; --llm-soft: #ebe8fa; --rules: #1f7a3a; --rules-soft: #e2f2e6; --derived: #8a5300; --derived-soft: #faf0d9; --manual: #0b5f86; --manual-soft: #e0f0f7;
    --k-odw: #0c6b67; --k-odw-soft: #dff0ed; --k-pel: #4b3aa8; --k-pel-soft: #ebe8fa; --k-prz: #9a4a10; --k-prz-soft: #fbeadb;
    --mark: rgba(255, 190, 0, .40); --mark-line: #b98200; --viewer: #4f5f5e;
    --radius: 8px; --shadow: 0 1px 2px rgba(13, 40, 40, .08), 0 2px 8px rgba(13, 40, 40, .05);
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1514; --panel: #142020; --panel-2: #192827; --ink: #e4eeec; --muted: #a2b6b2; --line: #283a38; --line-strong: #3a504d;
      --brand: #092d2e; --accent: #4cc2b5; --accent-ink: #052120; --accent-soft: #123432;
      --ok: #74d396; --ok-soft: #153223; --warn: #f2c14e; --warn-soft: #33290f; --bad: #ff9a88; --bad-soft: #3b1c18;
      --llm: #aea6ff; --llm-soft: #252046; --rules: #74d396; --rules-soft: #153223; --derived: #f2c14e; --derived-soft: #33290f; --manual: #7fd0f2; --manual-soft: #11303c;
      --k-odw: #4cc2b5; --k-odw-soft: #123432; --k-pel: #aea6ff; --k-pel-soft: #252046; --k-prz: #f0a668; --k-prz-soft: #3a2614;
      --viewer: #22302f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1514; --panel: #142020; --panel-2: #192827; --ink: #e4eeec; --muted: #a2b6b2; --line: #283a38; --line-strong: #3a504d;
    --brand: #092d2e; --accent: #4cc2b5; --accent-ink: #052120; --accent-soft: #123432;
    --ok: #74d396; --ok-soft: #153223; --warn: #f2c14e; --warn-soft: #33290f; --bad: #ff9a88; --bad-soft: #3b1c18;
    --llm: #aea6ff; --llm-soft: #252046; --rules: #74d396; --rules-soft: #153223; --derived: #f2c14e; --derived-soft: #33290f; --manual: #7fd0f2; --manual-soft: #11303c;
    --k-odw: #4cc2b5; --k-odw-soft: #123432; --k-pel: #aea6ff; --k-pel-soft: #252046; --k-prz: #f0a668; --k-prz-soft: #3a2614;
    --viewer: #22302f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 8px; top: -60px; background: var(--panel); color: var(--ink); padding: 8px 12px; border-radius: 6px; z-index: 10; }
  .skip:focus { top: 8px; }
  a { color: var(--accent); }

  /* ---------- pasek górny ---------- */
  .topbar { background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 18px; padding: 0 20px; min-height: 60px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 0; background: none; border: 0; color: inherit; cursor: pointer; }
  .brand b { font-size: 18px; letter-spacing: .2px; }
  .search { flex: 1 1 300px; max-width: 560px; position: relative; }
  .search input { width: 100%; height: 38px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; padding: 0 12px 0 34px; font-size: 14px; }
  .search input::placeholder { color: rgba(255,255,255,.7); }
  .search svg { position: absolute; left: 10px; top: 11px; opacity: .8; }
  .topbar .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa3b2; flex: none; }
  .dot.on { background: #6fe0a0; } .dot.off { background: #f0a500; }
  .who { background: none; border: 1px solid transparent; color: #fff; font-size: 14px; padding: 4px 8px; border-radius: 6px; cursor: pointer; opacity: .92; }
  .who:hover { border-color: rgba(255,255,255,.3); }
  .iconbtn { background: none; border: 1px solid rgba(255,255,255,.3); color: var(--brand-ink); border-radius: 6px; padding: 5px 8px; cursor: pointer; }

  /* ---------- układ ---------- */
  .shell { flex: 1; min-height: 0; display: flex; }
  nav.side { flex: none; width: 250px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .navlist { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: auto; flex: 1; }
  .nav { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--ink); }
  .nav:hover { background: var(--panel-2); }
  .nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav .n { margin-left: auto; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 0 8px; }
  .nav .n.hot { background: var(--focus); color: #142221; }
  .nav .n.bad { color: var(--bad); }
  .nav.sub { padding-left: 26px; font-size: 13.5px; }
  .nav.sub .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navsep { height: 1px; background: var(--line); margin: 8px 4px; }
  .navlabel { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 10px 12px 4px; font-weight: 600; }
  .navfoot { padding: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  main#main { flex: 1; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .page { padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1400px; width: 100%; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); padding: 0 14px; min-height: 40px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .crumb { font-size: 13px; color: var(--muted); }
  .crumb button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
  h1 { margin: 2px 0 6px; font-size: 25px; line-height: 1.25; }
  h2 { margin: 0; font-size: 16px; }
  .meta { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 600; }
  .headrow { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .headrow > div:first-child { flex: 1 1 420px; min-width: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .card-h h2 { flex: 1; }
  .card-b { padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { padding: 14px 16px; }
  .stat .l { font-size: 13px; color: var(--muted); }
  .stat .v { font-size: 26px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .stat .s { font-size: 13px; color: var(--muted); }
  .v.warn { color: var(--warn); } .v.bad { color: var(--bad); } .v.ok { color: var(--ok); }
  .cols { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .cols > .wide { flex: 3 1 520px; min-width: 0; }
  .cols > .narrow { flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; padding: 10px 12px; }
  td { padding: 11px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  th:first-child, td:first-child { padding-left: 16px; } th:last-child, td:last-child { padding-right: 16px; }
  td.mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
  .tag { display: inline-block; border-radius: 4px; padding: 1px 8px; font-weight: 600; font-size: 13px; white-space: nowrap; border: 1px solid transparent; }
  .t-odwolanie { background: var(--k-odw-soft); color: var(--k-odw); }
  .t-pelnomocnictwo { background: var(--k-pel-soft); color: var(--k-pel); }
  .t-przelew { background: var(--k-prz-soft); color: var(--k-prz); }
  .t-other { background: var(--panel-2); color: var(--muted); border-color: var(--line-strong); }
  .t-rej { color: var(--muted); border-color: var(--line-strong); font-weight: 500; }
  .st-ok { color: var(--ok); font-weight: 600; } .st-warn { color: var(--warn); font-weight: 600; } .st-bad { color: var(--bad); font-weight: 600; } .st-muted { color: var(--muted); }
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
  .checks .ico { font-weight: 800; text-align: center; }
  .checks .skipbtn { margin-left: 8px; vertical-align: 1px; }
  .checks li.skipped > span:last-child > span:first-of-type, .skipped-row td:first-child { color: var(--muted); }
  .checks small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; word-break: break-word; }
  .banner { display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px; border: 1px solid; }
  .banner.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  .banner.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 32px 24px; max-width: 460px; }
  .empty h3 { color: var(--ink); margin: 10px 0 6px; font-size: 17px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; display: inline-block; vertical-align: -2px; flex: none; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------- wczytywanie ---------- */
  #drop { border: 2px dashed var(--line-strong); border-radius: 10px; padding: 40px 20px; text-align: center; background: var(--panel); }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop h2 { font-size: 20px; margin: 10px 0 4px; }
  #drop p { margin: 0 auto 18px; color: var(--muted); max-width: 520px; }
  .pickers { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* ---------- dokument ---------- */
  .docview { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(400px, 1fr); }
  .viewer { background: var(--viewer); display: flex; flex-direction: column; min-height: 0; position: relative; }
  .vbar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; color: #fff; font-size: 13px; }
  .vbar .grow { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vbtn { min-width: 34px; height: 32px; border-radius: 6px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; cursor: pointer; padding: 0 8px; text-decoration: none; display: inline-flex; align-items: center; font-size: 13px; }
  #pages { flex: 1; overflow: auto; padding: 8px 18px 18px; display: flex; flex-direction: column; align-items: safe center; gap: 16px; }
  .pg { position: relative; flex: none; width: calc(var(--zoom, 100) * 1%); max-width: calc(var(--zoom, 100) * 9px); background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .pg img { display: block; width: 100%; height: 100%; }
  .hl { position: absolute; background: var(--mark); outline: 2px solid var(--mark-line); border-radius: 2px; pointer-events: none; animation: pulse 1.2s ease-out 1; }
  @keyframes pulse { from { box-shadow: 0 0 0 8px rgba(255,190,0,.45); } to { box-shadow: 0 0 0 0 rgba(255,190,0,0); } }
  .locinfo { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); border-left: 4px solid var(--mark-line); padding: 7px 12px; border-radius: 6px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.25); display: flex; gap: 8px; align-items: center; z-index: 2; }
  .locinfo.muted { border-left-color: var(--line-strong); color: var(--muted); }
  .vph { margin: auto; color: #e6eaf0; text-align: center; max-width: 360px; padding: 24px; }
  .panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .panel-h { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
  .kind { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kind h2 { font-size: 18px; }
  .kind .conf { margin-left: auto; font-size: 13px; color: var(--muted); }
  .kind .conf b { color: var(--ok); }
  .bar6 { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar6 i { display: block; height: 100%; background: var(--accent); }
  .prog { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  details { font-size: 13px; margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .bars { margin-top: 8px; display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: 130px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; }
  .bar .track { position: relative; height: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--line-strong); border-radius: 4px; }
  .bar.win .fill { background: var(--accent); }
  .bar .thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
  .bar .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .facts b { color: var(--ink); font-weight: 600; }
  .toolbar { display: flex; gap: 6px; padding: 10px 18px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .toolbar .grow { flex: 1; }
  .fields { flex: 1; overflow: auto; padding: 4px 18px 18px; }
  .group h3 { margin: 14px 0 6px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .field { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); }
  .field.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .field.done { background: var(--panel-2); }
  .field .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .field label { font-weight: 600; font-size: 14px; }
  .field .path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .field .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .field input { width: 100%; margin-top: 6px; height: 40px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 10px; background: var(--panel); font-weight: 600; }
  .field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .field input.null { font-weight: 400; font-style: italic; }
  .field input::placeholder { color: var(--muted); }
  .fb { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .fb .msg { font-size: 13px; flex: 1; min-width: 160px; }
  .ev { font-size: 12.5px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
  .ev mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }
  .badge { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 10px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
  .b-LLM { color: var(--llm); background: var(--llm-soft); }
  .b-reguły { color: var(--rules); background: var(--rules-soft); }
  .b-wyliczone { color: var(--derived); background: var(--derived-soft); }
  .b-brak { color: var(--muted); border-color: var(--line-strong); }
  .b-ręcznie { color: var(--manual); background: var(--manual-soft); }
  .pgbtn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 5px; font-size: 12px; padding: 1px 7px; cursor: pointer; }
  .pgbtn:hover { border-color: var(--accent); color: var(--accent); }
  .ok-mark { color: var(--ok); font-weight: 700; font-size: 13px; }
  .panel-f { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel-f .hint { font-size: 12.5px; color: var(--muted); flex: 1 1 180px; }
  pre { margin: 12px 18px; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .alert { margin: 14px 18px; padding: 12px 14px; border-radius: var(--radius); border: 1px solid; font-size: 14px; }
  .alert.warn { background: var(--warn-soft); border-color: var(--warn); }
  .alert.bad { background: var(--bad-soft); border-color: var(--bad); }
  .alert h3 { margin: 0 0 4px; font-size: 15px; }
  .alert p { margin: 4px 0; }
  .alert code, .lead code, .kv code { font-family: var(--mono); background: var(--panel); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); font-size: 12.5px; }

  /* ---------- kontrola ---------- */
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 14px; align-items: center; }
  .grid2 input, .grid2 select { height: 40px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 10px; background: var(--panel); }
  .result { margin-top: 12px; padding: 12px; border-radius: 6px; background: var(--accent-soft); font-size: 14px; }
  .opt { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .opt input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* ---------- klasy / raport ---------- */
  .lead { color: var(--muted); margin: 0; max-width: 780px; }
  .cls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .cls-card { padding: 16px; }
  .cls-card h3 { margin: 0 0 4px; font-size: 17px; display: flex; gap: 8px; align-items: center; }

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const say = (t) => { $("#live").textContent = t; };
const plural = (n, a, b, c) => n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? b : c;
const clone = (o) => o == null ? o : JSON.parse(JSON.stringify(o));
const fold = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l").replace(/Ł/g, "L").toLowerCase();
const compact = (s) => fold(s).replace(/[\W_]+/g, "");
const fmtDate = (iso) => { const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}.${m[2]}.${m[1]}` : (iso || ""); };

const S = {
  status: null, classes: null, rules: null,
  items: [], view: "start", caseName: null, current: null,
  checks: {}, checksRaw: {}, skip: {}, log: [], q: "",
  filter: "todo", tab: "dane", zoom: 100, info: {}, activePath: null, termDays: {},
  who: (() => { try { return localStorage.getItem("aktomat-who") || ""; } catch (e) { return ""; } })(),
};
const KIND = { odwolanie: ["ODW", "Odwołanie"], pelnomocnictwo: ["PEŁ", "Pełnomocnictwo"], przelew: ["PRZ", "Potwierdzenie przelewu"] };
const kindLabel = (k) => KIND[k]?.[1] || humanize(k || "");
const tag = (k) => k ? `<span class="tag ${KIND[k] ? "t-" + esc(k) : "t-other"}">${esc(kindLabel(k))}</span>` : `<span class="tag t-rej">Nierozpoznany</span>`;
const SRC = { "reguły": "reguła", "LLM": "model językowy", "wyliczone": "wyliczone", "brak": "nie znaleziono", "ręcznie": "poprawione ręcznie" };
const VNAME = { nip: "NIP", regon: "REGON", krs: "KRS", pesel: "PESEL", nrb: "numeru rachunku" };

/* ---------- motyw, referent ---------- */
try { const t = localStorage.getItem("o2j-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark"; document.documentElement.dataset.theme = t;
  try { localStorage.setItem("o2j-theme", t); } catch (e) {}
};
function drawWho() { $("#who").textContent = "Referent: " + (S.who || "—"); }
$("#who").onclick = () => {
  const v = window.prompt("Imię i nazwisko referenta (zapisywane w dzienniku zmian):", S.who || "");
  if (v === null) return; S.who = v.trim(); drawWho();
  try { localStorage.setItem("aktomat-who", S.who); } catch (e) {}
};
drawWho();
$("#home").onclick = () => go("start");
$("#q").addEventListener("input", (e) => { S.q = e.target.value; drawNav(); if (["start", "kolejka"].includes(S.view) || S.q) render(); });

/* ---------- dane startowe ---------- */
fetch("/api/status").then(r => r.json()).then(s => {
  S.status = s;
  $("#chips").innerHTML = `<span class="chip" title="${s.llm ? "Model językowy uzupełnia pola, których nie wyznaczyły reguły" : "Ekstrakcja wyłącznie regułami"}"><span class="dot ${s.llm ? "on" : "off"}"></span>${s.llm ? "LLM: " + esc(s.model) : "Same reguły"} · OCR: ${s.ocr ? esc(s.ocr_silnik) : "wył."}</span>`;
}).catch(() => { $("#chips").innerHTML = `<span class="chip"><span class="dot off"></span>brak połączenia z serwerem</span>`; });
fetch("/api/klasy").then(r => r.json()).then(c => { S.classes = c; render(); });
fetch("/api/kontrola/reguly").then(r => r.json()).then(r => { S.rules = r; });

/* ---------- stan dokumentów ---------- */
const stateOf = (it) => it.pending ? "pending" : it.blad ? "err" : it.klasa ? "ok" : "rej";
const caseNames = () => [...new Set(S.items.map(i => i.sprawa))];
const caseItems = (name) => S.items.filter(i => i.sprawa === name);
function valOf(it, p) { const f = it.slad?.pola?.[p]; return p in (it.edits || {}) ? it.edits[p] : f?.wartosc; }
function validation(it, p) { return S.checks[it.sprawa]?.walidacja?.[it.plik]?.[p]; }
function needsCheck(it, p) {
  if (it.ok?.[p]) return false;
  const f = it.slad?.pola?.[p]; if (!f) return false;
  const v = valOf(it, p);
  return v === null || v === undefined || (f.zrodlo === "LLM" && !(p in it.edits)) || (f.uwagi || []).length > 0 || validation(it, p)?.ok === false;
}
function counts(it) {
  const pola = Object.keys(it.slad?.pola || {});
  const todo = pola.filter(p => needsCheck(it, p)).length, done = pola.filter(p => it.ok?.[p]).length;
  return { total: pola.length, todo, done };
}
function matches(it) {
  if (!S.q.trim()) return true;
  const q = compact(S.q);
  return compact(it.plik + " " + it.sprawa + " " + JSON.stringify(it.json || {})).includes(q);
}

/* ---------- nawigacja ---------- */
function go(view, opts = {}) {
  S.view = view;
  if ("caseName" in opts) S.caseName = opts.caseName;
  if ("item" in opts) { S.current = opts.item; S.activePath = null; S.filter = "todo"; S.tab = "dane"; }
  drawNav(); render();
  $("#main").scrollTop = 0;
}
function drawNav() {
  const busy = running + queue.length > 0;
  const todoDocs = S.items.filter(i => i.klasa && counts(i).todo > 0).length;
  const names = caseNames().filter(n => caseItems(n).some(matches));
  let h = `<button class="nav" type="button" data-go="start" ${S.view === "start" ? 'aria-current="page"' : ""}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>Wczytaj dokumenty${busy ? '<span class="n"><span class="spinner"></span></span>' : ""}</button>
    <button class="nav" type="button" data-go="kolejka" ${S.view === "kolejka" ? 'aria-current="page"' : ""}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1h11"/></svg>Kolejka weryfikacji${todoDocs ? `<span class="n hot">${todoDocs}</span>` : ""}</button>
    <div class="navlabel">Sprawy</div>`;
  if (!names.length) h += `<div class="st-muted" style="font-size:13px;padding:4px 12px 8px">${S.items.length ? "Brak wyników wyszukiwania." : "Brak wczytanych spraw."}</div>`;
  names.forEach(n => {
    const ch = S.checks[n]?.podsumowanie, cur = (S.view === "sprawa" || S.view === "kontrola" || S.view === "dokument") && S.caseName === n;
    h += `<button class="nav sub" type="button" data-case="${esc(n)}" ${cur ? 'aria-current="page"' : ""} title="${esc(n)}"><span class="cn">${esc(n)}</span>${ch?.braki ? `<span class="n bad" title="braki formalne">${ch.braki} ${plural(ch.braki, "brak", "braki", "braków")}</span>` : `<span class="n st-muted">${caseItems(n).length}</span>`}</button>`;
  });
  h += `<div class="navsep"></div>
    <button class="nav" type="button" data-go="klasy" ${S.view === "klasy" ? 'aria-current="page"' : ""}>Klasy i reguły (YAML)</button>
    <button class="nav" type="button" data-go="raport" ${S.view === "raport" ? 'aria-current="page"' : ""}>Raport jakości</button>
    <button class="nav" type="button" data-go="dziennik" ${S.view === "dziennik" ? 'aria-current="page"' : ""}>Dziennik zmian${S.log.length ? `<span class="n st-muted">${S.log.length}</span>` : ""}</button>`;
  $("#navlist").innerHTML = h;
  $$("#navlist [data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $$("#navlist [data-case]").forEach(b => b.onclick = () => go("sprawa", { caseName: b.dataset.case }));
  $("#zipAll").disabled = busy || !S.items.some(i => !i.pending && !i.blad);
}

function render() {
  const v = S.view, m = $("#main");
  if (v === "dokument" && S.current && S.items.includes(S.current)) return renderDoc();
  if (v === "sprawa" && S.caseName && caseItems(S.caseName).length) return renderCase();
  if (v === "kontrola" && S.caseName && caseItems(S.caseName).length) return renderControl();
  if (v === "kolejka") return renderQueue();
  if (v === "klasy") return renderClasses();
  if (v === "raport") return renderReport();
  if (v === "dziennik") return renderLog();
  S.view = "start"; renderStart();
}

/* ---------- wczytywanie ---------- */
function renderStart() {
  const names = caseNames();
  $("#main").innerHTML = `<div class="page">
    <div><h1>Wczytaj dokumenty sprawy</h1><p class="lead">AktoMat rozpozna typ każdego dokumentu (odwołanie, pełnomocnictwo, potwierdzenie przelewu), wyciągnie dane do JSON i sprawdzi kompletność teczki. Pliki z jednego folderu albo archiwum trafiają do jednej sprawy.</p></div>
    <div id="drop">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--accent)"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
      <h2>Przeciągnij tutaj pliki PDF, folder sprawy albo archiwum ZIP</h2>
      <p>Skany są odczytywane przez OCR. Dokumenty spoza skonfigurowanych klas dostają pusty JSON <code>{}</code>.</p>
      <div class="pickers"><button class="btn primary" type="button" data-pick="pickFiles">Wybierz pliki PDF</button><button class="btn" type="button" data-pick="pickFolder">Wybierz folder</button><button class="btn" type="button" data-pick="pickZip">Wybierz ZIP</button></div>
    </div>
    ${names.length ? `<section class="card"><div class="card-h"><h2>Wczytane sprawy</h2></div><div class="tw"><table><thead><tr><th>Sprawa</th><th>Dokumenty</th><th>Pola do sprawdzenia</th><th>Kontrola formalna</th></tr></thead><tbody>
      ${names.filter(n => caseItems(n).some(matches)).map(n => { const its = caseItems(n), todo = its.reduce((a, i) => a + counts(i).todo, 0), ch = S.checks[n]?.podsumowanie;
        return `<tr class="click" data-case="${esc(n)}"><td><b>${esc(n)}</b></td><td>${its.length}</td><td>${todo ? `<span class="st-warn">${todo}</span>` : '<span class="st-ok">0</span>'}</td><td>${!ch ? '<span class="st-muted">…</span>' : ch.braki ? `<span class="st-bad">${ch.braki} ${plural(ch.braki, "brak", "braki", "braków")}</span>` : '<span class="st-ok">bez braków</span>'}</td></tr>`; }).join("")}
    </tbody></table></div></section>` : ""}
  </div>`;
  $$("[data-pick]").forEach(b => b.onclick = () => $("#" + b.dataset.pick).click());
  $$("tr[data-case]").forEach(r => r.onclick = () => go("sprawa", { caseName: r.dataset.case }));
  const drop = $("#drop");
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = onDrop;
}
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { if (!e.target.closest?.("#drop")) onDrop(e); });
async function onDrop(e) {
  e.preventDefault(); $("#drop")?.classList.remove("over");
  const entries = [...(e.dataTransfer?.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return intake([...(e.dataTransfer?.files || [])].map(f => ({ file: f, rel: f.name })));
  const out = []; await Promise.all(entries.map(en => walk(en, "", out))); intake(out);
}
function walk(entry, prefix, out) {
  return new Promise(res => {
    if (entry.isFile) return entry.file(f => { out.push({ file: f, rel: prefix + f.name }); res(); }, res);
    const reader = entry.createReader(), all = [];
    const next = () => reader.readEntries(async batch => {
      if (!batch.length) { await Promise.all(all.map(c => walk(c, prefix + entry.name + "/", out))); return res(); }
      all.push(...batch); next();
    }, res);
    next();
  });
}
$("#pickFiles").onchange = (e) => { intake([...e.target.files].map(f => ({ file: f, rel: f.name }))); e.target.value = ""; };
$("#pickZip").onchange = (e) => { intake([...e.target.files].map(f => ({ file: f, rel: f.name }))); e.target.value = ""; };
$("#pickFolder").onchange = (e) => { intake([...e.target.files].map(f => ({ file: f, rel: f.webkitRelativePath || f.name }))); e.target.value = ""; };

const queue = []; let running = 0, total = 0, done = 0, firstCase = null;
function intake(list) {
  const ok = list.filter(x => /\.(pdf|zip)$/i.test(x.file.name));
  if (list.length - ok.length) say(`Pominięto ${list.length - ok.length} plików, które nie są PDF ani ZIP.`);
  ok.forEach(x => {
    const isZip = /\.zip$/i.test(x.file.name), parts = x.rel.split("/").filter(Boolean);
    const it = { plik: x.file.name, sprawa: isZip ? x.file.name.replace(/\.zip$/i, "") : (parts.length > 1 ? parts[parts.length - 2] : "bez sprawy"), pending: true, zip: isZip, edits: {}, ok: {} };
    S.items.push(it); queue.push({ it, x }); total++;
    if (!firstCase) firstCase = it.sprawa;
  });
  drawNav(); render(); pump();
}
function pump() {
  progress();
  while (running < 3 && queue.length) {
    const { it, x } = queue.shift(); running++;
    const fd = new FormData(); fd.append("files", x.file, x.file.name); fd.append("sciezki", x.rel);
    fetch("/api/extract", { method: "POST", body: fd }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(res => place(it, res))
      .catch(e => Object.assign(it, { pending: false, blad: "Błąd połączenia: " + e.message }))
      .finally(() => {
        running--; done++; progress();
        const finished = running + queue.length === 0;
        caseNames().forEach(n => { if (!caseItems(n).some(i => i.pending)) recheck(n); });
        drawNav();
        const fc = firstCase && (caseItems(firstCase).length ? firstCase : caseNames()[0]);
        if (finished && S.view === "start" && fc) { const c = fc; firstCase = null; go("sprawa", { caseName: c }); say("Analiza zakończona."); }
        else if (S.view !== "dokument" || S.current?.pending || !S.items.includes(S.current)) render();
        if (finished) firstCase = null;
        pump();
      });
  }
}
function place(it, res) {
  const fresh = res.map(r => Object.assign({ pending: false, edits: {}, ok: {} }, r, { orig: clone(r.json) }));
  S.items.splice(S.items.indexOf(it), 1, ...fresh);
  if (S.current === it) S.current = fresh[0] || null;
}
function progress() {
  const p = $("#progress"), busy = running + queue.length > 0; p.hidden = !busy;
  const pct = total ? Math.round(100 * done / total) : 0;
  p.firstElementChild.style.width = pct + "%"; p.setAttribute("aria-valuenow", pct);
  if (!busy) { total = 0; done = 0; }
}

/* ---------- kontrola formalna (serwer, reguły z config/kontrola.yaml) ---------- */
const recheckTimers = {};
function recheck(name, delay = 0) {
  clearTimeout(recheckTimers[name]);
  recheckTimers[name] = setTimeout(async () => {
    const dokumenty = caseItems(name).filter(i => !i.pending && !i.blad).map(i => ({ plik: i.plik, klasa: i.klasa, json: i.json }));
    try {
      const r = await fetch("/api/kontrola", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dokumenty, dni: S.termDays }) });
      S.checksRaw[name] = await r.json(); applySkips(name);
    } catch (e) { return; }
    drawNav();
    if (S.caseName === name || S.view === "start" || S.view === "kolejka") {
      if (S.view === "dokument") refreshFieldFlags(); else render();
    }
  }, delay);
}

/* Pominięcie braku przez referenta: wynik "pominiete", z uzasadnieniem; liczniki bez tej pozycji. */
const SKIPPABLE = ["brak", "niezgodne", "ostrzezenie"];
function applySkips(name) {
  const raw = S.checksRaw[name]; if (!raw) return;
  const ch = JSON.parse(JSON.stringify(raw)), sk = S.skip[name] || {};
  for (const kind of ["wymagane", "pola", "zgodnosc"]) ch[kind].forEach(x => {
    x.klucz = kind + ":" + x.id;
    const k = sk[x.klucz];
    if (k && SKIPPABLE.includes(x.wynik)) Object.assign(x, { wynik_pierwotny: x.wynik, wynik: "pominiete", pominiecie: k });
  });
  const all = [...ch.wymagane, ...ch.pola, ...ch.zgodnosc];
  ch.podsumowanie.braki = all.filter(x => ["brak", "niezgodne"].includes(x.wynik)).length;
  ch.podsumowanie.ostrzezenia = all.filter(x => x.wynik === "ostrzezenie").length;
  ch.podsumowanie.pominiete = all.filter(x => x.wynik === "pominiete").length;
  S.checks[name] = ch;
}
function findCheck(name, key) { const ch = S.checks[name]; return ch && [...ch.wymagane, ...ch.pola, ...ch.zgodnosc].find(x => x.klucz === key); }
function skipLog(name, x, akcja, na) { S.log.push({ czas: new Date().toISOString(), kto: S.who || "", sprawa: name, plik: "(kontrola formalna)", pole: x.opis, akcja, z: null, na: na ?? null }); }
function bindSkips(name) {
  $$("[data-skip]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const x = findCheck(name, b.dataset.skip); if (!x) return;
    const powod = window.prompt(`Pominąć „${x.opis}”?\nUzasadnienie (opcjonalnie), np. „wpis uiszczony, potwierdzenie w systemie finansowym”:`, "");
    if (powod === null) return;
    (S.skip[name] ||= {})[x.klucz] = { powod: powod.trim(), kto: S.who || "", czas: new Date().toISOString() };
    skipLog(name, x, "pominięto brak", powod.trim() || null);
    applySkips(name); say(`Pominięto: ${x.opis}.`); drawNav(); render();
  });

/* ---------- pewność klasyfikacji ---------- */
function confidence(it) {
  const k = it.slad?.klasyfikacja; if (!k) return { level: "—" };
  const pts = k.punkty || {}, thr = (S.status?.klasy || []).reduce((m, c) => (m[c.nazwa] = c.prog, m), {});
  const sorted = Object.entries(pts).sort((a, b) => b[1] - a[1]);
  if (!k.wynik) return { level: "nie rozpoznano", pts, thr, sorted };
  const best = pts[k.wynik], second = sorted.find(([n]) => n !== k.wynik)?.[1] ?? 0, t = thr[k.wynik] ?? 5;
  const level = best >= 2 * t && best - second >= t ? "wysoka" : best - second >= t / 2 ? "średnia" : "niska";
  return { level, pts, thr, sorted, best, t };
}

/* ---------- weryfikacja dokumentu ---------- */
function humanize(s) { const A = new Set(["nip", "krs", "regon", "bzp", "ted", "kio", "pesel", "id"]); if (A.has(String(s).toLowerCase())) return String(s).toUpperCase(); s = String(s).replace(/[_-]+/g, " ").replace(/([a-ząćęłńóśźż])([A-ZĄĆĘŁŃÓŚŹŻ])/g, "$1 $2").trim(); return s.charAt(0).toUpperCase() + s.slice(1); }

  const last = keys[keys.length - 1]; o[/^\d+$/.test(last) ? +last : last] = val;
}

}

      ${(r.zgodnosc || []).map(x => `<tr><td>zgodność</td><td>${esc(x.opis)}</td><td class="mono">${esc(x.a.klasa)}:${esc(x.a.pole)} ↔ ${esc(x.b.klasa)}:${esc(x.b.pole)} (${esc(x.tryb)})</td></tr>`).join("")}
      ${(r.terminy || []).map(x => `<tr><td>termin</td><td>${esc(x.opis)}</td><td class="mono">${esc(x.klasa)}:${esc(x.pole)} + ${esc(x.dni)} dni</td></tr>`).join("")}
      ${Object.entries(r.walidacja || {}).map(([k, v]) => `<tr><td>walidacja</td><td>Suma kontrolna: ${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join("")}
    </tbody></table></div></section></div>`;
}

/* ---------- raport ---------- */
function renderReport() {
  $("#main").innerHTML = `<div class="page md" id="report"><div class="empty"><span class="spinner"></span></div></div>`;
  fetch("/api/raport").then(r => r.json()).then(r => {
    $("#report").innerHTML = r.jest ? md(r.tekst) : `<h1>Raport jakości</h1><p class="lead">Raport jeszcze nie powstał. Uruchom ocenę na danych treningowych:</p><pre style="margin:12px 0">python -m odw2json eval --gt &lt;hacknation-2026&gt;/dane --no-llm</pre>`;
  });
}
function md(src) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const lines = src.split(/\r?\n/); let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^[\s|:-]+$/.test(r)));
      out += `<div class="tw card"><table><thead><tr>${cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (/^\s*[-*]\s+/.test(l)) { out += "<ul>"; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) out += `<li>${inline(lines[i++].replace(/^\s*[-*]\s+/, ""))}</li>`; out += "</ul>"; continue; }
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
    i++;
  }
  return out;
}

/* ---------- pobieranie ---------- */
const outName = (it) => it.plik.replace(/\.pdf$/i, "") + ".json";
const outBody = (it) => it.klasa ? JSON.stringify(it.json, null, 2) : (S.status?.pusty_json ?? "{}");
function save(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function downloadZip(items, name, inne = []) {
  const pliki = items.filter(it => !it.pending && !it.blad).map(it => ({ sciezka: (it.sprawa && it.sprawa !== "bez sprawy" ? it.sprawa + "/" : "") + outName(it), json: it.klasa ? it.json : (S.status?.pusty_json ?? "{}") }));
  try {
    const r = await fetch("/api/zip", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pliki, inne }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    save(await r.blob(), name); say(`Pobrano ${pliki.length} plików JSON w archiwum ZIP.`);
  } catch (e) { say("Nie udało się przygotować archiwum: " + e.message); }
}
$("#zipAll").onclick = () => downloadZip(S.items, "wyniki_aktomat.zip", S.log.length ? [{ sciezka: "dziennik_zmian.csv", tekst: logCsv(S.log) }] : []);

drawNav(); render();
</script>
