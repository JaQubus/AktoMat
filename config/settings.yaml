# Ustawienia ogólne. Klucz API NIE trafia tutaj, tylko do pliku .env (LLM_API_KEY).

llm:
  enabled: true
  # Dowolne API zgodne z OpenAI. Domyślnie Scaleway Generative APIs (Paryż, UE).
  # Nadpisywane przez LLM_BASE_URL / LLM_MODEL w .env (np. lokalny vLLM/Ollama z tym samym modelem).
  base_url: https://api.scaleway.ai/v1
  model: gpt-oss-120b
  temperature: 0
  max_tokens: 6000
  timeout: 90               # sekundy na jedno zapytanie
  retries: 3
  json_mode: true
  max_doc_chars: 24000      # ile tekstu dokumentu trafia do modelu (kluczowe dane są na pierwszych stronach)
  extra_body:
    reasoning_effort: medium
  # Profile wybierane w .env przez LLM_PROFILE=<nazwa>; klucz/URL/model z <NAZWA>_API_KEY / _BASE_URL / _MODEL.
  profiles:
    ovh:                    # OVHcloud AI Endpoints (Francja, UE); klucz w OVH_API_KEY. gpt-oss-20b = 21B
      base_url: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
      model: gpt-oss-20b
    sherlock:               # CloudFerro Sherlock (polska firma, UE); klucz w SHERLOCK_API_KEY. Model 11B = 18 pkt UZP
      base_url: https://api-sherlock.cloudferro.com/openai/v1
      model: speakleash/Bielik-11B-v3.0-Instruct   # albo CYFRAGOVPL/PLLuM-12B-instruct, meta-llama/Llama-3.1-8B-Instruct (20 pkt)
    ark:                    # ARK Labs / ARK Cloud (ARK sp. z o.o., Warszawa; infrastruktura w UE); klucz w ARK_API_KEY
      base_url: https://api.ark-labs.cloud/api/v1
      model: arklabsai/Bielik-11B-v3.0-Instruct   # pełne id z prefiksem arklabsai/ (ARK nie ma aliasów)
      max_doc_chars: 20000  # kontekst Bielika 32K tokenów (prompt + dokument + odpowiedź)
      max_tokens: 4000
      extra_body: {}        # Bielik nie jest modelem "reasoning"; ARK odrzuca nieznane pola (400 unknown_parameter)
    groq:                   # darmowy limit, tylko do testów (firma z USA; w zgłoszeniu zostaje Scaleway)
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      # darmowy plan Groq: max 8000 tokenów na minutę (wejście + max_tokens) - krótszy kontekst i odpowiedź
      max_doc_chars: 12000
      max_tokens: 3500
      extra_body:
        reasoning_effort: low

ocr:
  enabled: true
  engine: auto              # auto | tesseract | rapidocr  (auto: Tesseract, a gdy go brak - RapidOCR z pip)
  lang: pol
  dpi: 300
  min_chars_per_page: 40    # strona z mniejszą liczbą znaków jest traktowana jak skan
  max_pages: 8              # OCR tylko pierwszych N stron (0 = wszystkie)
  # tesseract_cmd: C:\Program Files\Tesseract-OCR\tesseract.exe   # albo TESSERACT_CMD w .env

classify_head_chars: 6000   # klasyfikacja na podstawie początku dokumentu
workers: 4                  # równoległe dokumenty
# UZP: 150 PDF w maks. 45 min. Po tym czasie (od startu partii) LLM jest pomijany i zostają same reguły,
# żeby partia zawsze skończyła się w limicie. Uwaga: budżet liczy się dla całego uruchomienia `run`.
time_budget_s: 2400
# Dokument spoza skonfigurowanych klas: zawartość pliku .json (UZP: "pusty plik .json"); null = nie twórz pliku
unknown_output: "{}"
