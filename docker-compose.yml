services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env]
    environment:
      DATA_DIR: /data
      CASES_DIR: /var/cases
      CACHE_DIR: /var/cache/odwolania
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - ./fixtures:/app/fixtures:ro
      - cases:/var/cases
      - cache:/var/cache/odwolania
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
volumes:
  cases:
  cache:
