[project]
name = "odwolania2json"
version = "0.1.0"
description = "ODWOŁANIA2JSON - Karta Odwołania KIO (HackNation 2026, UZP)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "rapidfuzz>=3.9",
  "litellm>=1.40",
  "pyhanko>=0.25",
  "reportlab>=4.2",
  "cryptography>=42",
]

[project.optional-dependencies]
ocr = ["docling>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]
